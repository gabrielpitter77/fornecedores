name: Publicar main no site (gh-pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copiar main para gh-pages
        run: git push --force origin HEAD:refs/heads/gh-pages
